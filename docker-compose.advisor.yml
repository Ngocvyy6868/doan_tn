name: techzone-advisor
services:
  web:
    build:
      context: .
      dockerfile: docker/advisor/Dockerfile
      target: web
    ports: ["${SITE_PORT:-8080}:80"]
    volumes: [advisor_static:/static:ro]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/advisor/Dockerfile
      target: backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      POSTGRES_DB: techzone
      POSTGRES_USER: techzone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-techzone-qwen3-4b}
      ADVISOR_MODELS_OFFLINE: "true"
      ADVISOR_HYDE: ${ADVISOR_HYDE:-true}
      ADVISOR_RERANK: ${ADVISOR_RERANK:-true}
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - advisor_models:/models
      - advisor_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: techzone
      POSTGRES_USER: techzone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [advisor_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techzone -d techzone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [advisor_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    # Ghim phiên bản để kết quả thực nghiệm tái lập được; nâng cấp có chủ đích rồi chạy lại đánh giá.
    image: ollama/ollama:0.40.13
    gpus: all
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - advisor_ollama:/root/.ollama
      - ./docker/advisor/Modelfile:/models/Modelfile:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Chạy một lần: tải Qwen3-4B Q8_0 và tạo techzone-qwen3-4b từ Modelfile nếu chưa có.
  # Lần đầu cần Internet (~4,4GB); các lần sau bỏ qua nên chạy offline được.
  ollama-init:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: ollama:11434
    volumes:
      - ./docker/advisor/Modelfile:/models/Modelfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama show techzone-qwen3-4b >/dev/null 2>&1 ||
        { ollama pull qwen3:4b-q8_0 && ollama create techzone-qwen3-4b -f /models/Modelfile; }
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  advisor_postgres:
  advisor_redis:
  advisor_ollama:
  advisor_models:
  advisor_static:
