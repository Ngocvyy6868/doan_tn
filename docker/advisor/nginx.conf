server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    # DNS nội bộ của Docker; phân giải lại "backend" mỗi 10 s để không lỗi 502 khi container backend được tạo lại.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
    }
    location /static/ { alias /static/; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
